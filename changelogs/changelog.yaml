      - fix-uninstall-historical-leftovers.yml
      - fix-uninstall-managed-vhost-paths.yml
      - fix-vhost-symlink-reaping.yml
      - molecule-per-platform-test-backend.yaml
      - refactor-lazy-merge.yml
      - reject-duplicate-vhost-names.yml
      - style-fqcn-molecule-shared.yml
      - style-fqcn.yml
    release_date: '2026-07-30'
