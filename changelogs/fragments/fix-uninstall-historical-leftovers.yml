---

bugfixes:
  - >
    ``run`` role - Uninstall now removes historical leftovers it previously
    could not see: vhost config files carry an ownership marker and both vhost
    directories are swept for it (covering vhosts renamed or de-listed since
    deployment on Debian/SUSE, where the directories are kept), the
    role-managed module symlinks are removed from ``mods-enabled`` on Debian,
    and the SUSE ``/etc/sysconfig/apache2`` edits (``APACHE_MODULES`` and the
    cleared ``APACHE_*`` values) are restored from a copy of the pre-role file
    saved before the first edit.
