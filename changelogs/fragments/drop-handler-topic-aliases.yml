---
minor_changes:
  - >-
    Remove the previous handler topics ahead of the announced version 2.0.0:
    "run_apache_httpd: validate configuration", "run_apache_httpd: restart
    apache_httpd.service", "run_apache_httpd: reload apache_httpd.service"
    and "run_apache_httpd: systemd daemon-reload". Notify the role-prefixed
    topics instead. We decided that this is a non-breaking change: the
    topics are role internals, and their use by third parties is very
    unlikely.
