---
bugfixes:
  - >
    ``run`` role - Stale role-managed (symlink-type) module configs are now
    removed even when ``run_apache_httpd_modules_enabled`` is emptied. The
    cleanup was gated on there being enabled symlink modules, so emptying the
    list (after modules had previously been managed) left the old module symlinks
    enabled. The cleanup now runs whenever
    ``run_apache_httpd_modules_disable_unmanaged`` is true and only ever removes
    files whose name is part of the role's module map
    (``__run_apache_httpd_modules_map_resources``, symlink type).
