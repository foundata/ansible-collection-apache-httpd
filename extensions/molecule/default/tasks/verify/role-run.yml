## Regression: stale module cleanup runs when the enabled list is emptied
#
# Debian-only (because that is where the role manages modules as symlinks); Platforms
# without symlink-type modules (RedHat, SUSE) yield an empty managed set and remove
# nothing.

- name: "Molecule | Verify | Validate stale module cleanup on emptied list (Debian)"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'
  vars:
    __testing_managed_module_filenames: >-
      {{
        (run_apache_httpd_modules_enabled | ansible.builtin.default([]))
        | ansible.builtin.select('in', __run_apache_httpd_modules_map_resources.keys() | ansible.builtin.list)
        | ansible.builtin.map('extract', __run_apache_httpd_modules_map_resources)
        | ansible.builtin.map(attribute='conf_files')
        | ansible.builtin.flatten
        | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'symlink')
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.unique
        | ansible.builtin.list
      }}
  block:

    - name: "Molecule | Verify | Stat role-managed module configs before emptying the list"
      ansible.builtin.stat:
        path: "{{ __run_apache_httpd_config_service_dropin_modules_enabled_dir_path }}/{{ item }}"
      register: __testing_module_before
      loop: "{{ __testing_managed_module_filenames }}"


    - name: "Molecule | Verify | Assert at least one role-managed module config exists before"
      ansible.builtin.assert:
        that:
          - (__testing_module_before['results'] | ansible.builtin.selectattr('stat.exists') | ansible.builtin.list | ansible.builtin.length) > 0
        fail_msg: "No role-managed module configs found before test; setup invalid (managed={{ __testing_managed_module_filenames }})."
        success_msg: "Role-managed module configs exist before emptying the list."


    - name: "Molecule | Verify | Re-run role with an empty module list (disable_unmanaged)"
      ansible.builtin.include_role:
        name: "foundata.apache_httpd.run"
      vars:
        run_apache_httpd_modules_enabled: []
        run_apache_httpd_modules_disable_unmanaged: true


    - name: "Molecule | Verify | Stat role-managed module configs after emptying the list"
      ansible.builtin.stat:
        path: "{{ __run_apache_httpd_config_service_dropin_modules_enabled_dir_path }}/{{ item }}"
      register: __testing_module_after
      loop: "{{ __testing_managed_module_filenames }}"


    - name: "Molecule | Verify | Assert role-managed module configs were removed"
      ansible.builtin.assert:
        that:
          - (__testing_module_after['results'] | ansible.builtin.selectattr('stat.exists') | ansible.builtin.list | ansible.builtin.length) == 0
        fail_msg: "Stale module configs remained after emptying run_apache_httpd_modules_enabled."
        success_msg: "Emptying run_apache_httpd_modules_enabled removed the role-managed module configs."


## Migration: pre-existing, unmanaged vhost configs (brownfield)
#
# Taking over a host that already serves vhosts is the common migration case,
# and run_apache_httpd_vhosts_delete_unmanaged decides what happens to those
# files. Both directions are contractual: with deletion enabled the role owns
# the vhost directories exclusively, with it disabled foreign vhosts must
# survive so the role can be adopted next to an existing setup.
#
# The planted vhost is created in vhosts-available only and never enabled, so it
# stays inert and cannot influence the configuration test that the role's
# handlers run. Deletion is exercised regardless, because the role searches both
# the available and the enabled directory.
#
# Order matters: the preserving run comes first, so the removing run afterwards
# leaves the host in the clean state the uninstall regression below expects.

- name: "Molecule | Verify | Validate unmanaged vhost handling on migration (integration)"
  vars:
    __testing_unmanaged_vhost: >-
      {{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/molecule-unmanaged.conf
    __testing_managed_vhost: >-
      {{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/example.com.conf
  block:

    - name: "Molecule | Verify | Plant a pre-existing, unmanaged vhost config"
      ansible.builtin.copy:
        content: |
          # Unmanaged vhost planted by the molecule test to simulate a host that
          # already served vhosts before the role was adopted.
          <VirtualHost *:8099>
              ServerName molecule-unmanaged.example.net
              DocumentRoot "/var/www/example.com"
          </VirtualHost>
        dest: "{{ __testing_unmanaged_vhost }}"
        owner: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_owner }}"
        group: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_group }}"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Re-run the role with unmanaged vhost deletion disabled"
      ansible.builtin.include_role:
        name: "foundata.apache_httpd.run"
      vars:
        run_apache_httpd_vhosts_delete_unmanaged: false


    - name: "Molecule | Verify | Stat the unmanaged vhost after the run with deletion disabled"
      ansible.builtin.stat:
        path: "{{ __testing_unmanaged_vhost }}"
      register: __testing_unmanaged_vhost_kept


    - name: "Molecule | Verify | Assert the unmanaged vhost survives when deletion is disabled"
      ansible.builtin.assert:
        that:
          - __testing_unmanaged_vhost_kept['stat']['exists']
        fail_msg: >-
          The unmanaged vhost '{{ __testing_unmanaged_vhost }}' was removed even though
          run_apache_httpd_vhosts_delete_unmanaged was false. Adopting the role next to an
          existing setup would delete foreign vhosts.
        success_msg: >-
          The unmanaged vhost was left untouched while
          run_apache_httpd_vhosts_delete_unmanaged was false.


    - name: "Molecule | Verify | Re-run the role with unmanaged vhost deletion enabled"
      ansible.builtin.include_role:
        name: "foundata.apache_httpd.run"
      vars:
        run_apache_httpd_vhosts_delete_unmanaged: true


    - name: "Molecule | Verify | Stat the unmanaged and a managed vhost after the run with deletion enabled"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ __testing_unmanaged_vhost }}"
        - "{{ __testing_managed_vhost }}"
      register: __testing_unmanaged_vhost_reaped


    - name: "Molecule | Verify | Assert the unmanaged vhost is removed while the managed one stays"
      ansible.builtin.assert:
        that:
          - not __testing_unmanaged_vhost_reaped['results'][0]['stat']['exists']
          - __testing_unmanaged_vhost_reaped['results'][1]['stat']['exists']
        fail_msg: >-
          Enabling run_apache_httpd_vhosts_delete_unmanaged did not remove the unmanaged vhost
          '{{ __testing_unmanaged_vhost }}', or it also removed the managed vhost
          '{{ __testing_managed_vhost }}'.
        success_msg: >-
          Enabling run_apache_httpd_vhosts_delete_unmanaged removed the unmanaged vhost and
          kept the managed one.


# Flush pending config-validation/restart handlers now, while the role is still
# installed and its configuration is valid, so they do not run at play end after
# the uninstall regression below has removed the package and its config.
- name: "Molecule | Verify | Flush handlers before the uninstall regression"
  ansible.builtin.meta: flush_handlers


## Regression: a half-missing snakeoil pair is regenerated as a whole
#
# The HTTPS catch-all VirtualHost references certificate AND key; with only
# the certificate checked, an existing certificate with a missing key was
# left as-is and Apache refused to start. Remove the key, re-run the role and
# assert the pair is complete again with the expected key permissions.

- name: "Molecule | Verify | Snakeoil pair: remove the key half"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_snakeoil_key_path }}"
    state: "absent"


- name: "Molecule | Verify | Snakeoil pair: re-run the foundata.apache_httpd.run role"
  ansible.builtin.include_role:
    name: "foundata.apache_httpd.run"


- name: "Molecule | Verify | Snakeoil pair: run the notified handlers"
  ansible.builtin.meta: "flush_handlers"


- name: "Molecule | Verify | Snakeoil pair: get the status of both halves"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_snakeoil_stat
  loop:
    - "{{ __run_apache_httpd_snakeoil_cert_path }}"
    - "{{ __run_apache_httpd_snakeoil_key_path }}"


- name: "Molecule | Verify | Snakeoil pair: assert the pair was regenerated as a whole"
  ansible.builtin.assert:
    that:
      - __testing_snakeoil_stat['results'][0]['stat']['exists']
      - __testing_snakeoil_stat['results'][1]['stat']['exists']
      - __testing_snakeoil_stat['results'][1]['stat']['mode'] == '0600'
      - __testing_snakeoil_stat['results'][1]['stat']['pw_name'] == 'root'
    fail_msg: >-
      Re-running the role did not regenerate the snakeoil pair after its key
      was removed (cert exists:
      {{ __testing_snakeoil_stat['results'][0]['stat']['exists'] }}, key exists:
      {{ __testing_snakeoil_stat['results'][1]['stat']['exists'] }}). The HTTPS
      catch-all VirtualHost references both files, Apache would refuse to start.
    success_msg: "A snakeoil pair with a missing key is regenerated as a whole (key 0600, root-owned)."


## Regression: uninstall removes managed vhost files/symlinks by absolute path
#
# This block runs LAST because it uninstalls the role. It guards the uninstall
# path-join fix: managed vhost configs were removed by bare filename (e.g.
# "example.com.conf"), which did not resolve, so they survived on Debian/SUSE
# where the vhost directories are kept. A managed vhost file in vhosts-available
# and its vhosts-enabled symlink must exist after converge and be gone after a
# run_apache_httpd_state: absent run.

- name: "Molecule | Verify | Validate uninstall removes managed vhost files (integration)"
  vars:
    __testing_uninstall_vhost_available: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/example.com.conf"
    __testing_uninstall_vhost_enabled: "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}/example.com.conf"
  block:

    - name: "Molecule | Verify | Stat managed vhost file and symlink before uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_before
      loop:
        - "{{ __testing_uninstall_vhost_available }}"
        - "{{ __testing_uninstall_vhost_enabled }}"


    - name: "Molecule | Verify | Assert managed vhost file and symlink exist before uninstall"
      ansible.builtin.assert:
        that:
          - __testing_uninstall_before['results'][0]['stat']['exists']
          - __testing_uninstall_before['results'][1]['stat']['exists']
        fail_msg: "Managed vhost file/symlink missing before uninstall; test setup invalid."
        success_msg: "Managed vhost file and enabled symlink exist before uninstall."


    # Simulate a vhost that was renamed since deployment: the marker-carrying
    # file exists on disk but is absent from run_apache_httpd_vhosts_config,
    # so only the marker sweep can find it during uninstall.
    - name: "Molecule | Verify | Plant a renamed historical vhost file before uninstall"
      ansible.builtin.copy:
        src: "{{ __testing_uninstall_vhost_available }}"
        dest: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/renamed-leftover.conf"
        remote_src: true
        mode: "preserve"


    - name: "Molecule | Verify | Plant the matching enabled symlink for the historical vhost"
      ansible.builtin.file:
        src: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/renamed-leftover.conf"
        dest: "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}/renamed-leftover.conf"
        state: "link"


    # An administrator's own vhost file (no ownership marker). On Debian and
    # SUSE the vhost directories are stock directories the role must not
    # remove, so the file has to survive the marker sweep. On Red Hat
    # platforms the role created the directories itself and removes them
    # completely - nothing to plant there.
    - name: "Molecule | Verify | Plant an administrator-owned vhost file without the marker"
      ansible.builtin.copy:
        dest: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/admin-own.conf"
        content: |
          # hand-made by the administrator, not Ansible
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r"
      when:
        - (ansible_facts['os_family'] | ansible.builtin.lower) in ['debian', 'suse']


    - name: "Molecule | Verify | Read the saved pre-role sysconfig before uninstall (SUSE)"
      ansible.builtin.slurp:
        src: "/etc/sysconfig/apache2.ansible-orig"
      register: __testing_uninstall_sysconfig_backup
      when:
        - ansible_facts['os_family'] == 'Suse'


    - name: "Molecule | Verify | Uninstall the role (run_apache_httpd_state: absent)"
      ansible.builtin.include_role:
        name: "foundata.apache_httpd.run"
      vars:
        run_apache_httpd_state: "absent"


    - name: "Molecule | Verify | Stat managed vhost file and symlink after uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_after
      loop:
        - "{{ __testing_uninstall_vhost_available }}"
        - "{{ __testing_uninstall_vhost_enabled }}"


    - name: "Molecule | Verify | Assert managed vhost file and symlink were removed by uninstall"
      ansible.builtin.assert:
        that:
          - not __testing_uninstall_after['results'][0]['stat']['exists']
          - not __testing_uninstall_after['results'][1]['stat']['exists']
        fail_msg: >-
          Uninstall left managed vhost files behind (available exists={{ __testing_uninstall_after['results'][0]['stat']['exists'] }},
          enabled exists={{ __testing_uninstall_after['results'][1]['stat']['exists'] }}).
        success_msg: "Uninstall removed the managed vhost file and its enabled symlink."


    - name: "Molecule | Verify | Stat the planted historical vhost after uninstall"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_leftover_after
      loop:
        - "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/renamed-leftover.conf"
        - "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}/renamed-leftover.conf"


    - name: "Molecule | Verify | Assert the marker sweep removed the renamed historical vhost"
      ansible.builtin.assert:
        that:
          - not __testing_uninstall_leftover_after['results'][0]['stat']['exists']
          - not __testing_uninstall_leftover_after['results'][1]['stat']['exists']
        fail_msg: >-
          A marker-carrying vhost file absent from run_apache_httpd_vhosts_config
          survived the uninstall (renamed historical vhosts would linger).
        success_msg: "The renamed historical vhost was removed by the marker sweep."


    - name: "Molecule | Verify | Check the vhost directories are gone after uninstall (Red Hat platforms)"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_uninstall_dirs_stat
      failed_when:
        - __testing_uninstall_dirs_stat['stat']['exists']
      loop:
        - "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}"
        - "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}"
      when:
        - (ansible_facts['os_family'] | ansible.builtin.lower) not in ['debian', 'suse']


    - name: "Molecule | Verify | Check the administrator's vhost file survived the uninstall (Debian, SUSE)"
      ansible.builtin.stat:
        path: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/admin-own.conf"
      register: __testing_uninstall_admin_stat
      failed_when:
        - not __testing_uninstall_admin_stat['stat']['exists']
      when:
        - (ansible_facts['os_family'] | ansible.builtin.lower) in ['debian', 'suse']


    - name: "Molecule | Verify | Remove the administrator-owned test file (Debian, SUSE)"
      ansible.builtin.file:
        path: "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}/admin-own.conf"
        state: "absent"
      when:
        - (ansible_facts['os_family'] | ansible.builtin.lower) in ['debian', 'suse']


    - name: "Molecule | Verify | Stat role-managed module symlinks after uninstall (Debian)"
      ansible.builtin.stat:
        path: "/etc/apache2/mods-enabled/{{ item }}"
      register: __testing_uninstall_modlinks_after
      when:
        - ansible_facts['os_family'] == 'Debian'
      loop:
        - "ssl.load"
        - "headers.load"
        - "rewrite.load"


    - name: "Molecule | Verify | Assert role-managed module symlinks were removed (Debian)"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_uninstall_modlinks_after['results']
             | ansible.builtin.selectattr('stat', 'ansible.builtin.defined')
             | ansible.builtin.selectattr('stat.exists')
             | ansible.builtin.list | ansible.builtin.length) == 0
        fail_msg: "Role-managed module symlinks survived the uninstall in mods-enabled."
        success_msg: "Role-managed module symlinks were removed from mods-enabled."
      when:
        - ansible_facts['os_family'] == 'Debian'


    - name: "Molecule | Verify | Read the sysconfig after uninstall (SUSE)"
      ansible.builtin.slurp:
        src: "/etc/sysconfig/apache2"
      register: __testing_uninstall_sysconfig_after
      when:
        - ansible_facts['os_family'] == 'Suse'


    - name: "Molecule | Verify | Stat the saved pre-role sysconfig after uninstall (SUSE)"
      ansible.builtin.stat:
        path: "/etc/sysconfig/apache2.ansible-orig"
      register: __testing_uninstall_sysconfig_backup_after
      when:
        - ansible_facts['os_family'] == 'Suse'


    - name: "Molecule | Verify | Assert the pre-role APACHE_MODULES value was restored (SUSE)"
      ansible.builtin.assert:
        that:
          - >-
            ((__testing_uninstall_sysconfig_after['content'] | ansible.builtin.b64decode)
             | ansible.builtin.regex_search('(?m)^APACHE_MODULES=.*$'))
            == ((__testing_uninstall_sysconfig_backup['content'] | ansible.builtin.b64decode)
                | ansible.builtin.regex_search('(?m)^APACHE_MODULES=.*$'))
          - not __testing_uninstall_sysconfig_backup_after['stat']['exists']
        fail_msg: >-
          Uninstall did not restore the pre-role APACHE_MODULES sysconfig value
          (or left the saved pre-role copy behind).
        success_msg: "The pre-role APACHE_MODULES value was restored and the saved copy removed."
      when:
        - ansible_facts['os_family'] == 'Suse'


## Init-only merged variable evaluation
#
# Re-run the role's init with controlled inputs and assert the merged variables
# directly (whether materialized in tasks/init.yml or lazily in vars/main.yml):
# user/platform overrides must win, untouched defaults must survive, and the
# module list must include the MPM module and stay unique.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertions dereference the
# (lazily evaluated) effective variables. This runs LAST: the set_fact of
# run_apache_httpd_modules_enabled / __run_apache_httpd_main_directives_overwrite
# would otherwise leak into any full role run that follows. Only role init runs
# here, so it needs no package.

- name: "Molecule | Verify | Validate effective merged variables (init-only)"
  block:

    - name: "Molecule | Verify | Set controlled inputs for the merge checks"
      ansible.builtin.set_fact:
        run_apache_httpd_mpm: "event"
        run_apache_httpd_modules_enabled:
          - "rewrite"
          - "headers"
        run_apache_httpd_snippet_settings:
          hsts:
            max_age: 1234
        __run_apache_httpd_main_directives_overwrite:
          ServerTokens: "Full"


    - name: "Molecule | Verify | Re-initialize apache_httpd with controlled inputs"
      ansible.builtin.include_role:
        name: "foundata.apache_httpd.run"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective main directives merged correctly"
      ansible.builtin.assert:
        that:
          # platform/simulated overwrite wins over the default ("ProductOnly")
          - __run_apache_httpd_effective_main_directives['ServerTokens'] == "Full"
          # an untouched default survives
          - __run_apache_httpd_effective_main_directives['Timeout'] == 300
        fail_msg: "__run_apache_httpd_effective_main_directives did not merge defaults and overrides as expected."
        success_msg: "__run_apache_httpd_effective_main_directives merged defaults and overrides correctly."


    - name: "Molecule | Verify | Assert effective snippet settings merged correctly"
      ansible.builtin.assert:
        that:
          # user setting wins (highest priority)
          - __run_apache_httpd_effective_snippet_settings['hsts']['max_age'] == 1234
          # an untouched default survives
          - __run_apache_httpd_effective_snippet_settings['php-fpm']['tcp_port'] == 9000
        fail_msg: "__run_apache_httpd_effective_snippet_settings did not merge defaults and user settings as expected."
        success_msg: "__run_apache_httpd_effective_snippet_settings merged defaults and user settings correctly."


    - name: "Molecule | Verify | Assert RedHat-family platform overwrite is present in snippet settings"
      ansible.builtin.assert:
        that:
          # ssl_session_cache is set only by the RedHat-family platform overwrite
          # (vars/redhat.yml); other families set different values, so this check
          # is gated to the RedHat family.
          - __run_apache_httpd_effective_snippet_settings['tls-baseline']['ssl_session_cache'] == "shmcb:/run/httpd/ssl_scache(10485760)"
        fail_msg: "__run_apache_httpd_effective_snippet_settings did not include the RedHat-family platform overwrite."
        success_msg: "__run_apache_httpd_effective_snippet_settings includes the RedHat-family platform overwrite."
      when:
        - ansible_facts['os_family'] == "RedHat"


    - name: "Molecule | Verify | Assert effective modules list merged correctly"
      ansible.builtin.assert:
        that:
          - "'mpm_event' in __run_apache_httpd_effective_modules_enabled"
          - "'rewrite' in __run_apache_httpd_effective_modules_enabled"
          - "'headers' in __run_apache_httpd_effective_modules_enabled"
          - (__run_apache_httpd_effective_modules_enabled | ansible.builtin.unique | ansible.builtin.length)
            == (__run_apache_httpd_effective_modules_enabled | ansible.builtin.length)
        fail_msg: "__run_apache_httpd_effective_modules_enabled did not include the MPM/user modules or contained duplicates."
        success_msg: "__run_apache_httpd_effective_modules_enabled includes the MPM and user modules and is unique."
