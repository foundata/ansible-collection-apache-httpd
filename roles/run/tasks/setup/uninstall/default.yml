# Uninstall: Manage basic resource removal, such as packages or service users.

---

- name: "Setup | Uninstall | Gather service facts"
  ansible.builtin.service_facts:


- name: "Setup | Uninstall | Stop and disable service (best-effort): {{ __run_apache_httpd_apache_httpd_servicename }}"
  ansible.builtin.systemd_service:
    name: "{{ __run_apache_httpd_apache_httpd_servicename }}"
    state: "stopped"
    enabled: false
  failed_when: false # best-effort service stop
  when:
    - __run_apache_httpd_apache_httpd_servicename in ansible_facts['services']


- name: "Setup | Uninstall | Remove drop-in config files (snippets, vhosts)"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_dropin_path_item }}"
    state: "absent"
  vars:
    __run_apache_httpd_managed_vhost_filenames: >-
      {{
        (run_apache_httpd_vhosts_config | ansible.builtin.default([]))
        | ansible.builtin.map(attribute='name')
        | ansible.builtin.map('ansible.builtin.regex_replace', '$', '.conf')
        | ansible.builtin.list
      }}
    __run_apache_httpd_paths_to_remove: >-
      {{
        (
          (
            __run_apache_httpd_managed_vhost_filenames
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __run_apache_httpd_config_service_dropin_vhosts_available_dir_path ~ '/')
            | ansible.builtin.list
          )
          +
          (
            __run_apache_httpd_managed_vhost_filenames
            | ansible.builtin.map('ansible.builtin.regex_replace', '^', __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path ~ '/')
            | ansible.builtin.list
          )
          +
          [
            __run_apache_httpd_config_service_file_path,
            __run_apache_httpd_config_service_ports_file_path,
            __run_apache_httpd_config_service_dropin_snippets_dir_path
          ]
        ) | ansible.builtin.unique
      }}
  when:
    - __run_apache_httpd_paths_to_remove | ansible.builtin.length > 0
  loop: "{{ __run_apache_httpd_paths_to_remove }}"
  loop_control:
    loop_var: "__run_apache_httpd_dropin_path_item"


# Historical vhosts (renamed or de-listed since deployment) cannot be derived
# from the current run_apache_httpd_vhosts_config value. On Debian/SUSE the
# vhost directories are kept, so sweep them for files carrying the role's
# ownership marker (the list-based removal above still covers files from
# releases that predate the marker).
- name: "Setup | Uninstall | Find remaining vhost config files"
  ansible.builtin.find:
    paths:
      - "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}"
      - "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}"
    patterns:
      - "*.conf"
    # "any" so enabled-vhost symlinks are matched too (grep dereferences them,
    # so a symlink to a marker-carrying file is removed alongside its target)
    file_type: "any"
    hidden: true
  register: __run_apache_httpd_uninstall_find_result


- name: "Setup | Uninstall | Determine marker-managed vhost config files"
  ansible.builtin.command:
    argv: >-
      {{
        [__run_apache_httpd_grep_exec_path, '-l', '-s', '-x', '-F', '--', __run_apache_httpd_config_file_marker]
        + (__run_apache_httpd_uninstall_find_result['files']
           | ansible.builtin.rejectattr('isdir')
           | ansible.builtin.map(attribute='path') | ansible.builtin.list)
      }}
  register: __run_apache_httpd_uninstall_owned_result
  changed_when: false
  failed_when:
    - __run_apache_httpd_uninstall_owned_result['rc'] not in [0, 1, 2]
  when:
    - (__run_apache_httpd_uninstall_find_result['files'] | ansible.builtin.length) > 0


- name: "Setup | Uninstall | Remove marker-managed vhost config files"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_marked_vhost_item }}"
    state: "absent"
  loop: "{{ __run_apache_httpd_uninstall_owned_result['stdout_lines'] | ansible.builtin.default([]) }}"
  loop_control:
    loop_var: "__run_apache_httpd_marked_vhost_item"
    label: "{{ __run_apache_httpd_marked_vhost_item }}"


- name: "Setup | Uninstall | Remove vhosts directories (non-Debian platforms)"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_vhosts_dir_item }}"
    state: "absent"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) not in ['debian', 'suse']
  loop:
    - "{{ __run_apache_httpd_config_service_dropin_vhosts_available_dir_path }}"
    - "{{ __run_apache_httpd_config_service_dropin_vhosts_enabled_dir_path }}"
  loop_control:
    loop_var: "__run_apache_httpd_vhosts_dir_item"


- name: "Setup | Uninstall | Check if platform's original config backup exists"
  ansible.builtin.stat:
    path: "{{ __run_apache_httpd_config_service_file_distbackup_path }}"
  register: __run_apache_httpd_distbackup_stat


- name: "Setup | Uninstall | Restore platform's original config from backup"
  when:
    - __run_apache_httpd_distbackup_stat['stat']['exists']
  block:
    - name: "Setup | Uninstall | Restore config from backup file"
      ansible.builtin.copy:
        src: "{{ __run_apache_httpd_config_service_file_distbackup_path }}"
        dest: "{{ __run_apache_httpd_config_service_file_path }}"
        owner: "{{ __run_apache_httpd_config_service_file_owner }}"
        group: "{{ __run_apache_httpd_config_service_file_group }}"
        mode: "{{ __run_apache_httpd_config_service_file_mode }}"
        remote_src: true

    - name: "Setup | Uninstall | Remove backup notice comment from restored config"
      ansible.builtin.lineinfile:
        path: "{{ __run_apache_httpd_config_service_file_path }}"
        line: "{{ __run_apache_httpd_config_service_file_distbackup_comment }}"
        state: "absent"

    - name: "Setup | Uninstall | Remove the config backup file"
      ansible.builtin.file:
        path: "{{ __run_apache_httpd_config_service_file_distbackup_path }}"
        state: "absent"


- name: "Setup | Uninstall | Remove module config directory (modules-enabled, non-Debian platforms)"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_config_service_dropin_modules_enabled_dir_path }}"
    state: "absent"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) != 'debian'


# mods-enabled is kept on Debian (package directory), so the symlinks for the
# module universe this role manages (the same set the config-phase
# reconciliation owns via run_apache_httpd_modules_disable_unmanaged) are
# removed explicitly; symlinks cannot carry an ownership marker. Restoring
# the distribution's default module set is the package manager's job
# (purge + reinstall).
- name: "Setup | Uninstall | Remove role-managed module config symlinks (Debian)"
  ansible.builtin.file:
    path: "{{ __run_apache_httpd_config_service_dropin_modules_enabled_dir_path }}/{{ __run_apache_httpd_module_symlink_item }}"
    state: "absent"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'
  loop: >-
    {{
      __run_apache_httpd_modules_map_resources.values()
      | ansible.builtin.map(attribute='conf_files')
      | ansible.builtin.flatten
      | ansible.builtin.selectattr('type', 'ansible.builtin.equalto', 'symlink')
      | ansible.builtin.map(attribute='name')
      | ansible.builtin.unique
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__run_apache_httpd_module_symlink_item"
    label: "{{ __run_apache_httpd_module_symlink_item }}"


# The config tasks overwrite APACHE_MODULES and clear several APACHE_* values
# in /etc/sysconfig/apache2 (SUSE); the pre-role file is saved once before
# the first edit. Restore exactly the managed lines from that copy so
# unrelated admin edits to the file survive the uninstall.
- name: "Setup | Uninstall | Check for the saved pre-role sysconfig (SUSE)"
  ansible.builtin.stat:
    path: "{{ __run_apache_httpd_sysconfig_path }}.ansible-orig"
  register: __run_apache_httpd_sysconfig_backup_stat
  when:
    - (__run_apache_httpd_sysconfig_path | ansible.builtin.default('') | ansible.builtin.length) > 0


- name: "Setup | Uninstall | Restore the pre-role sysconfig values (SUSE)"
  when:
    - (__run_apache_httpd_sysconfig_path | ansible.builtin.default('') | ansible.builtin.length) > 0
    - __run_apache_httpd_sysconfig_backup_stat['stat']['exists']
  vars:
    __run_apache_httpd_sysconfig_managed_variables:
      - "APACHE_MODULES"
      - "APACHE_ACCESS_LOG"
      - "APACHE_SERVERSIGNATURE"
      - "APACHE_LOGLEVEL"
      - "APACHE_SERVERTOKENS"
      - "APACHE_TRACEENABLE"
      - "APACHE_USE_CANONICAL_NAME"
  block:

    - name: "Setup | Uninstall | Read the saved pre-role sysconfig"
      ansible.builtin.slurp:
        src: "{{ __run_apache_httpd_sysconfig_path }}.ansible-orig"
      register: __run_apache_httpd_sysconfig_backup_slurp


    - name: "Setup | Uninstall | Restore managed sysconfig lines to their pre-role values"
      ansible.builtin.lineinfile:
        path: "{{ __run_apache_httpd_sysconfig_path }}"
        regexp: "^{{ __run_apache_httpd_sysconfig_restore_item }}="
        line: "{{ __run_apache_httpd_sysconfig_orig_line }}"
        state: "present"
      vars:
        __run_apache_httpd_sysconfig_orig_line: >-
          {{
            (__run_apache_httpd_sysconfig_backup_slurp['content'] | ansible.builtin.b64decode)
            | ansible.builtin.regex_search('(?m)^' ~ __run_apache_httpd_sysconfig_restore_item ~ '=.*$')
          }}
      when:
        - __run_apache_httpd_sysconfig_orig_line is not ansible.builtin.none
      loop: "{{ __run_apache_httpd_sysconfig_managed_variables }}"
      loop_control:
        loop_var: "__run_apache_httpd_sysconfig_restore_item"


    - name: "Setup | Uninstall | Remove managed sysconfig lines absent from the pre-role file"
      ansible.builtin.lineinfile:
        path: "{{ __run_apache_httpd_sysconfig_path }}"
        regexp: "^{{ __run_apache_httpd_sysconfig_remove_item }}="
        state: "absent"
      vars:
        __run_apache_httpd_sysconfig_orig_line: >-
          {{
            (__run_apache_httpd_sysconfig_backup_slurp['content'] | ansible.builtin.b64decode)
            | ansible.builtin.regex_search('(?m)^' ~ __run_apache_httpd_sysconfig_remove_item ~ '=.*$')
          }}
      when:
        - __run_apache_httpd_sysconfig_orig_line is ansible.builtin.none
      loop: "{{ __run_apache_httpd_sysconfig_managed_variables }}"
      loop_control:
        loop_var: "__run_apache_httpd_sysconfig_remove_item"


    - name: "Setup | Uninstall | Remove the saved pre-role sysconfig"
      ansible.builtin.file:
        path: "{{ __run_apache_httpd_sysconfig_path }}.ansible-orig"
        state: "absent"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __run_apache_httpd_packages_uninstall }}"
    state: "absent"
  when:
    - __run_apache_httpd_packages_uninstall is ansible.builtin.defined
    - (__run_apache_httpd_packages_uninstall | ansible.builtin.length) > 0
